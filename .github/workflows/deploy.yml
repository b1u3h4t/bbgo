name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref to deploy"
        required: false
        default: "main"
  push:
    branches:
      - main
    # Keep Deploy in the default main check set (Go / Docker / lint / Deploy).
    # Only skip pure documentation so a workflow-only or code push never "loses" Deploy.
    paths-ignore:
      - "**/*.md"
      - "doc/**"
      - "apps/backtest-report/**"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, bbgo]
    timeout-minutes: 45
    # Runner host may export GOTOOLCHAIN=local; that blocks go from fetching
    # a newer toolchain when go.mod requires a patch newer than setup-go.
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Per-run tmpdir (scoped; safe on shared runners)
        run: bash scripts/ci-bbgo-tmpdir.sh setup

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Must match go.mod (upstream bumped to 1.27.2).
          go-version: "1.27.2"

      # Self-hosted runners run as github-runner (no sudo). Do not apt-install Node.
      # Do not set cache: yarn here — setup-node requires yarn on PATH before install.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Ensure yarn
        run: |
          set -euo pipefail
          npm install -g yarn@1.22.22
          node -v
          yarn -v

      - name: Build SPA + deploy binary to Tokyo
        env:
          # Re-assert: self-hosted runner .env may still inject GOTOOLCHAIN=local
          # into the step even when the job sets auto.
          GOTOOLCHAIN: auto
          BBGO_SSH_HOST: bbgo
          BBGO_HOME: /home/admin/bbgo
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          go version
          chmod +x scripts/deploy-prod.sh scripts/deploy-prod-remote.sh
          ssh -o BatchMode=yes -o ConnectTimeout=10 bbgo 'echo ssh_ok; systemctl is-active bbgo'
          scripts/deploy-prod.sh

      - name: Cleanup per-run tmpdir
        if: always()
        run: bash scripts/ci-bbgo-tmpdir.sh cleanup
