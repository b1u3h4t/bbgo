name: golang-lint
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  golangci:
    name: lint
    # Public repo: PRs on GitHub-hosted; push on dedicated bbgo runner
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","bbgo"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: ${{ github.event_name == 'pull_request' }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: 'v2.13'
