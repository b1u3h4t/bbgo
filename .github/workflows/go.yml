name: Go

on:
  push:
    branches:
    - "main"
  pull_request:

jobs:
  build:
    # Dedicated bbgo runner on nc3 (actions-runner-bbgo); not avalanchego-tuned
    runs-on: [self-hosted, bbgo]
    timeout-minutes: 45

    strategy:
      matrix:
        redis-version:
        - "6.2"
        go-version:
        - "1.26"
    env:
      GITHUB_CI: true
      MYSQL_DATABASE: bbgo
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "root" # pragma: allowlist secret

    steps:

    - uses: actions/checkout@v7

    - uses: actions/cache@v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Set up MySQL (Docker)
      run: |
        docker rm -f bbgo-ci-mysql >/dev/null 2>&1 || true
        docker run -d --name bbgo-ci-mysql \
          -e MYSQL_ALLOW_EMPTY_PASSWORD=yes \
          -e MYSQL_ROOT_PASSWORD=${{ env.MYSQL_PASSWORD }} \
          -e MYSQL_DATABASE=${{ env.MYSQL_DATABASE }} \
          -p 3306:3306 \
          mysql:8.0 \
          --default-authentication-plugin=mysql_native_password
        for i in $(seq 1 30); do
          if docker exec bbgo-ci-mysql mysqladmin ping -uroot -p${{ env.MYSQL_PASSWORD }} --silent; then
            break
          fi
          sleep 2
        done
        docker exec bbgo-ci-mysql mysql -uroot -p${{ env.MYSQL_PASSWORD }} -e "CREATE DATABASE IF NOT EXISTS ${{ env.MYSQL_DATABASE }};"

    - name: Set up redis (Docker)
      run: |
        docker rm -f bbgo-ci-redis >/dev/null 2>&1 || true
        docker run -d --name bbgo-ci-redis -p 6379:6379 redis:${{ matrix.redis-version }}
        for i in $(seq 1 20); do
          if docker exec bbgo-ci-redis redis-cli ping | grep -q PONG; then
            break
          fi
          sleep 1
        done

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install Migration Tool
      run: go install github.com/c9s/rockhopper/v2/cmd/rockhopper@latest

    - name: Test Migration SQL Files For MySQL
      run: |
        rockhopper --config rockhopper_mysql.yaml up

    - name: Test Migration SQL Files For SQLite
      run: |
        rockhopper --config rockhopper_sqlite.yaml up

    - name: Build
      run: go build -v ./cmd/bbgo

    - name: Link Market Data
      run: |
        mkdir -p ~/.bbgo/cache
        ln -sfn $PWD/data/binance-markets.json ~/.bbgo/cache/binance-markets.json
        touch data/binance-markets.json

    - name: Test
      run: |
        go test -count 3 -race -coverprofile coverage.txt -covermode atomic ./pkg/...
        sed -i -e '/_requestgen.go/d' coverage.txt

    - name: TestDnum
      run: |
        go test -race -coverprofile coverage_dnum.txt -covermode atomic -tags dnum ./pkg/...
        sed -i -e '/_requestgen.go/d' coverage_dnum.txt

    - name: Revive Check
      uses: morphy2k/revive-action@v2.7.8 # https://github.com/mgechev/revive/issues/956
      with:
        reporter: github-pr-review
        fail_on_error: true

    - name: Upload Coverage Report
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.txt,./coverage_dnum.txt
      continue-on-error: true

    - name: Create dotenv file
      run: |
        echo "DB_DRIVER=mysql" >> .env.local
        echo "DB_DSN=root:root@tcp(127.0.0.1:3306)/bbgo" >> .env.local

    - name: Cleanup CI containers
      if: always()
      run: |
        docker rm -f bbgo-ci-mysql bbgo-ci-redis >/dev/null 2>&1 || true
