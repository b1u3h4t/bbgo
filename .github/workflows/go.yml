name: Go

on:
  push:
    branches:
    - "main"
  pull_request:

jobs:
  build:
    # Public repo: never run untrusted fork PRs on self-hosted hardware.
    # push / same-repo work → nc3 bbgo runner; pull_request → GitHub-hosted.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","bbgo"]') }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 45 }}
    concurrency:
      group: go-ci-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true

    strategy:
      matrix:
        redis-version:
        - "6.2"
        go-version:
        - "1.26"
    env:
      GITHUB_CI: true
      MYSQL_DATABASE: bbgo
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "root" # pragma: allowlist secret
      # Self-hosted runners (esp. nc2) often already bind host :3306; use a dedicated CI port.
      MYSQL_HOST_PORT: ${{ github.event_name == 'pull_request' && 3306 || 13306 }}
      # Per-run names so a cancelled job's cleanup cannot docker-rm the new job's containers.
      CI_MYSQL_NAME: bbgo-ci-mysql-${{ github.run_id }}
      CI_REDIS_NAME: bbgo-ci-redis-${{ github.run_id }}

    steps:

    - uses: actions/checkout@v7

    - uses: actions/cache@v6
      # Self-hosted keeps GOCACHE/mod on disk; GitHub cache restore often fails (tar) and wastes ~1min.
      if: github.event_name == 'pull_request'
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Set up MySQL (ubuntu-latest)
      if: github.event_name == 'pull_request'
      run: |
        sudo /etc/init.d/mysql start
        mysql -e 'CREATE DATABASE ${{ env.MYSQL_DATABASE }};' -u${{ env.MYSQL_USER }} -p${{ env.MYSQL_PASSWORD }}

    - name: Set up redis (ubuntu-latest)
      if: github.event_name == 'pull_request'
      uses: shogo82148/actions-setup-redis@v1
      with:
        redis-version: ${{ matrix.redis-version }}

    - name: Set up MySQL (self-hosted Docker)
      if: github.event_name != 'pull_request'
      run: |
        docker rm -f "${CI_MYSQL_NAME}" >/dev/null 2>&1 || true
        # Free 13306 only from prior bbgo-ci-mysql-* leftovers (do not touch host mysqld).
        docker ps --filter name=bbgo-ci-mysql- --format '{{.ID}}' | xargs -r docker rm -f || true
        # Do not bind host :3306 — production/Harbor MySQL often owns it (docker exit 125).
        if ! docker run -d --name "${CI_MYSQL_NAME}" \
          -e MYSQL_ROOT_PASSWORD=${{ env.MYSQL_PASSWORD }} \
          -e MYSQL_DATABASE=${{ env.MYSQL_DATABASE }} \
          -p 127.0.0.1:${{ env.MYSQL_HOST_PORT }}:3306 \
          mysql:8.0; then
          echo "docker run ${CI_MYSQL_NAME} failed"
          ss -ltn | grep -E '(:|^)${{ env.MYSQL_HOST_PORT }}$' || true
          docker ps -a --filter name=bbgo-ci-mysql- || true
          exit 1
        fi
        # mysqladmin ping can succeed during entrypoint's temporary server (or even with
        # Access denied). Require a real authenticated query, twice, to pass the restart gap.
        ready=0
        for i in $(seq 1 60); do
          if docker exec "${CI_MYSQL_NAME}" mysql -uroot -p${{ env.MYSQL_PASSWORD }} -e "SELECT 1" >/dev/null 2>&1; then
            sleep 3
            if docker exec "${CI_MYSQL_NAME}" mysql -uroot -p${{ env.MYSQL_PASSWORD }} -e "SELECT 1" >/dev/null 2>&1; then
              ready=1
              break
            fi
          fi
          sleep 2
        done
        if [ "$ready" != "1" ]; then
          echo "MySQL did not become ready in time"
          docker logs "${CI_MYSQL_NAME}" || true
          exit 1
        fi
        docker exec "${CI_MYSQL_NAME}" mysql -uroot -p${{ env.MYSQL_PASSWORD }} -e "CREATE DATABASE IF NOT EXISTS ${{ env.MYSQL_DATABASE }};"

    - name: Set up redis (self-hosted Docker)
      if: github.event_name != 'pull_request'
      run: |
        docker rm -f "${CI_REDIS_NAME}" >/dev/null 2>&1 || true
        # Drop only previous CI redis containers so a cancelled sibling cannot leave us
        # bound, and so our later cleanup cannot kill another run's redis by a shared name.
        docker ps --filter name=bbgo-ci-redis- --format '{{.ID}}' | xargs -r docker rm -f || true
        docker run -d --name "${CI_REDIS_NAME}" -p 127.0.0.1:6379:6379 redis:${{ matrix.redis-version }}
        ready=0
        for i in $(seq 1 30); do
          if docker exec "${CI_REDIS_NAME}" redis-cli ping | grep -q PONG; then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" != "1" ]; then
          echo "Redis did not become ready in time"
          docker logs "${CI_REDIS_NAME}" || true
          exit 1
        fi
        if ! docker exec "${CI_REDIS_NAME}" redis-cli -h 127.0.0.1 ping 2>/dev/null | grep -q PONG; then
          if command -v nc >/dev/null 2>&1; then
            nc -z 127.0.0.1 6379 || { echo "Redis port 6379 not reachable on host"; exit 1; }
          fi
        fi

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        # Persistent cache on the bbgo runner; avoid slow/failing cache download+extract.
        cache: ${{ github.event_name == 'pull_request' }}

    - name: Install Migration Tool
      run: |
        if ! command -v rockhopper >/dev/null 2>&1; then
          go install github.com/c9s/rockhopper/v2/cmd/rockhopper@latest
        fi
        rockhopper version || true

    - name: Test Migration SQL Files For MySQL
      run: |
        # Point rockhopper at MYSQL_HOST_PORT (13306 on self-hosted, 3306 on ubuntu-latest).
        sed "s@:3306)@:${MYSQL_HOST_PORT})@" rockhopper_mysql.yaml > /tmp/rockhopper_mysql_ci.yaml
        rockhopper --config /tmp/rockhopper_mysql_ci.yaml up

    - name: Test Migration SQL Files For SQLite
      run: |
        rockhopper --config rockhopper_sqlite.yaml up

    - name: Build
      run: go build -o /dev/null ./cmd/bbgo

    - name: Link Market Data
      run: |
        mkdir -p ~/.bbgo/cache
        ln -sfn $PWD/data/binance-markets.json ~/.bbgo/cache/binance-markets.json
        touch data/binance-markets.json

    - name: Test
      run: |
        # Re-check redis: a cancelled sibling job used to `docker rm` a shared bbgo-ci-redis name.
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          docker exec "${CI_REDIS_NAME}" redis-cli ping | grep -q PONG
        fi
        # count=1 is enough on CI; -count 3 triples wall time. -race stays for data races.
        go test -count=1 -race -coverprofile coverage.txt -covermode atomic ./pkg/...
        sed -i -e '/_requestgen.go/d' coverage.txt

    - name: TestDnum
      run: |
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          docker exec "${CI_REDIS_NAME}" redis-cli ping | grep -q PONG
        fi
        # dnum checks decimal semantics; race is already covered by the Test step above.
        go test -count=1 -coverprofile coverage_dnum.txt -covermode atomic -tags dnum ./pkg/...
        sed -i -e '/_requestgen.go/d' coverage_dnum.txt

    - name: Revive Check
      uses: morphy2k/revive-action@v2.7.8
      with:
        # Valid inputs only (reporter / fail_on_error are not supported by this action).
        # Keep warnings as annotations; golang-lint.yml already gates style on PRs/main.
        path: ./pkg/...
        exclude: |
          ./pkg/**/*_test.go
          ./pkg/**/mocks/...
        fail-on-any: false

    - name: Upload Coverage Report
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.txt,./coverage_dnum.txt
      continue-on-error: true

    - name: Create dotenv file
      run: |
        echo "DB_DRIVER=mysql" >> .env.local
        echo "DB_DSN=root:root@tcp(127.0.0.1:${MYSQL_HOST_PORT})/bbgo" >> .env.local

    - name: Cleanup CI containers
      if: always() && github.event_name != 'pull_request'
      run: |
        docker rm -f "${CI_MYSQL_NAME}" "${CI_REDIS_NAME}" >/dev/null 2>&1 || true
