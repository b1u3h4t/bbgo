---
# udbox trend (box breakout) backtest
#
# On server (example):
#   ./bbgo-udbox-linux-amd64 backtest --config config/udbox-backtest.yaml \
#     --sync --sync-from 2026-08-01 --force -v
#
# Notes:
# - Prefer fixed `quantity` in backtest.
# - USDT-M futures backtest locks quote margin (qty*price/leverage), not base.
# - Sync needs BINANCE_API_KEY/SECRET and DB_DRIVER/DB_DSN in .env.local.
#
sessions:
  binance:
    exchange: binance
    envVarPrefix: BINANCE
    futures: true
    symbolLeverage:
      BTCUSDT: 2

backtest:
  startTime: "2026-08-01"
  endTime: "2026-09-01"
  symbols:
    - BTCUSDT
  sessions:
    - binance
  feeMode: native
  accounts:
    binance:
      makerFeeRate: 0.02%
      takerFeeRate: 0.05%
      balances:
        USDT: 10000.0

exchangeStrategies:
  - on: binance
    udbox:
      symbol: BTCUSDT
      interval: 4h
      boxWindow: 20
      # Wider floor / tighter ceiling → fewer thin fee-eating boxes
      minBoxWidthPct: 0.015
      maxBoxWidthPct: 0.05
      breakBufferPct: 0.001
      requireCompression: true
      compressionLookback: 10
      enableLong: true
      enableShort: true
      enableRange: true
      # Only lock/trade range when volatility is compressing
      rangeRequireCompression: true
      rangeBuyZonePct: 0.15
      rangeSellZonePct: 0.15
      rangeQtyRatio: 0.5
      # Opposite zone TP (larger R than mid)
      rangeTakeMid: false
      useNestFilter: true
      nestInterval: 1d
      nestEMAWindow: 20
      quantity: 0.05
      useBoxStop: true
      trailNewBox: true
      roiTakeProfit: 0
