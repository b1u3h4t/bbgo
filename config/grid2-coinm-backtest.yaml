---
# Coin-M (delivery) grid2 backtest.
# Session key must be the exchange name ("binance") for bbgo backtest CLI.
#
# Sync delivery klines then run:
#   bbgo backtest --config config/grid2-coinm-backtest.yaml --sync --sync-from 2026-08-25 -v
#   bbgo backtest --config config/grid2-coinm-backtest.yaml -v
#
sessions:
  binance:
    exchange: binance
    envVarPrefix: BINANCE
    futures: true
    delivery: true
    symbolLeverage:
      BNBUSD_PERP: 3

backtest:
  startTime: "2026-08-28"
  endTime: "2026-09-01"
  symbols:
    - BNBUSD_PERP
  sessions:
    - binance
  feeMode: native
  accounts:
    binance:
      makerFeeRate: 0.02%
      takerFeeRate: 0.05%
      balances:
        BNB: 1.0

exchangeStrategies:
  - on: binance
    grid2:
      symbol: BNBUSD_PERP
      upperPrice: 720.80
      lowerPrice: 718.80
      gridNumber: 4
      quantity: 1
      leverage: 3
      compound: false
      earnBase: true
      feeRate: 0.020%
      skipSpreadCheck: false
      resetPositionWhenStart: true
      clearOpenOrdersWhenStart: true
      keepOrdersWhenShutdown: false
      recoverOrdersWhenStart: false
