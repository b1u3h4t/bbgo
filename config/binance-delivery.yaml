---
# Binance Coin-M (delivery / dapi) + grid2 example
#
# Requires:
#   futures: true
#   delivery: true
#
# Coin-M grid2 notes:
#   - quantity is in CONTRACTS (not base coins)
#   - margin is in BASE (e.g. BTC for BTCUSD_PERP)
#   - set leverage; compound is disabled automatically
#   - earnBase is forced on (PnL tracked in base)

sessions:
  binance_delivery:
    exchange: binance
    envVarPrefix: BINANCE
    futures: true
    delivery: true
    # optional: set leverage per symbol
    # symbolLeverage:
    #   BTCUSD_PERP: 5

exchangeStrategies:
- on: binance_delivery
  grid2:
    symbol: BTCUSD_PERP
    gridNumber: 10
    # quantity = contracts per pin
    quantity: 1
    leverage: 5
    # optional: cap base margin budget (otherwise uses available base wallet)
    # baseInvestment: 0.05
    upperPrice: 120000
    lowerPrice: 80000
    # feeRate defaults to ~0.02% for coin-m if omitted
    # feeRate: 0.0002
    skipSpreadCheck: false
    keepOrdersWhenShutdown: true
